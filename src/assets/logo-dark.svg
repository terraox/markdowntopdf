    <!-- Folded corner -->
    <path d="M62 10 L62 26 L78 26" fill="none" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Hash symbol — Markdown -->
    <g stroke="url(#g)" stroke-width="2" stroke-linecap="round" opacity="0.9">
        <line x1="42" y1="38" x2="39" y2="56" />
        <line x1="51" y1="38" x2="48" y2="56" />
        <line x1="37" y1="44" x2="53" y2="44" />
        <line x1="36" y1="50" x2="52" y2="50" />
    </g>

    <!-- Arrow — transformation -->
    <path d="M54 68 Q66 68 66 78" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-linecap="round" />
    <polyline points="62,75 66,79 70,75" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-linecap="round"
